name: Build Dependencies (MinGW)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-mingw:
    strategy:
      fail-fast: false
      matrix:
        build_type:
          - Debug
          - Release

    runs-on: windows-latest

    env:
      BUILD_TYPE: ${{ matrix.build_type }}
      ASSIMP_INSTALL_DIR: ${{ github.workspace }}/deps-install/assimp
      FREETYPE_INSTALL_DIR: ${{ github.workspace }}/deps-install/freetype
      SDL3_INSTALL_DIR: ${{ github.workspace }}/deps-install/SDL3
      SHADERC_INSTALL_DIR: ${{ github.workspace }}/deps-install/shaderc
      OPENAL_INSTALL_DIR: ${{ github.workspace }}/deps-install/openal
      CURL_INSTALL_DIR: ${{ github.workspace }}/deps-install/curl
      OPENSSL_INSTALL_DIR: ${{ github.workspace }}/deps-install/openssl

      ASSIMP_VERSION: v6.0.5
      FREETYPE_VERSION: VER-2-14-3
      SDL3_VERSION: release-3.4.8
      SHADERC_VERSION: main
      OPENAL_VERSION: 1.25.2
      CURL_VERSION: curl-8_22_0
      OPENSSL_VERSION: openssl-3.5.6

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MinGW
        shell: pwsh
        run: |
          for ($i = 1; $i -le 5; $i++) {
            choco install mingw --version=14.2.0 -y
            if ($LASTEXITCODE -eq 0) { break }
            Write-Host "choco install failed (attempt $i of 5), retrying..."
            Start-Sleep -Seconds (15 * $i)
          }
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Create directories
        shell: bash
        run: |
          mkdir -p build
          mkdir -p deps-install

      - name: Clone assimp
        shell: bash
        run: |
          git clone \
            --branch $ASSIMP_VERSION \
            --recursive \
            https://github.com/assimp/assimp.git

      - name: Build assimp
        shell: bash
        run: |
          cmake -S assimp -B build/assimp \
            -G "MinGW Makefiles" \
            -DCMAKE_BUILD_TYPE=$BUILD_TYPE \
            -DCMAKE_INSTALL_PREFIX=$ASSIMP_INSTALL_DIR \
            -DCMAKE_INSTALL_LIBDIR=lib \
            -DASSIMP_BUILD_TESTS=OFF \
            -DASSIMP_BUILD_ASSIMP_TOOLS=OFF \
            -DBUILD_SHARED_LIBS=ON

          cmake --build build/assimp --config $BUILD_TYPE --parallel 2
          cmake --install build/assimp --config $BUILD_TYPE

      - name: Clone freetype
        shell: bash
        run: |
          git clone \
            --branch $FREETYPE_VERSION \
            --recursive \
            https://github.com/freetype/freetype.git

      - name: Build freetype
        shell: bash
        run: |
          cmake -S freetype -B build/freetype \
            -G "MinGW Makefiles" \
            -DCMAKE_BUILD_TYPE=$BUILD_TYPE \
            -DCMAKE_INSTALL_PREFIX=$FREETYPE_INSTALL_DIR \
            -DCMAKE_INSTALL_LIBDIR=lib \
            -DBUILD_SHARED_LIBS=ON

          cmake --build build/freetype --config $BUILD_TYPE --parallel
          cmake --install build/freetype --config $BUILD_TYPE

      - name: Clone SDL3
        shell: bash
        run: |
          git clone \
            --branch $SDL3_VERSION \
            --recursive \
            https://github.com/libsdl-org/SDL.git SDL3

      - name: Build SDL3
        shell: bash
        run: |
          cmake -S SDL3 -B build/SDL3 \
            -G "MinGW Makefiles" \
            -DCMAKE_BUILD_TYPE=$BUILD_TYPE \
            -DCMAKE_INSTALL_PREFIX=$SDL3_INSTALL_DIR \
            -DSDL_SHARED=ON \
            -DSDL_STATIC=ON

          cmake --build build/SDL3 --config $BUILD_TYPE --parallel
          cmake --install build/SDL3 --config $BUILD_TYPE

      - name: Clone shaderc
        shell: bash
        run: |
          git clone \
            --branch $SHADERC_VERSION \
            https://github.com/google/shaderc.git

          python3 shaderc/utils/git-sync-deps

      - name: Build shaderc
        shell: bash
        run: |
          cmake -S shaderc -B build/shaderc \
            -G "MinGW Makefiles" \
            -DCMAKE_BUILD_TYPE=$BUILD_TYPE \
            -DCMAKE_INSTALL_PREFIX=$SHADERC_INSTALL_DIR \
            -DCMAKE_INSTALL_LIBDIR=lib \
            -DSHADERC_SKIP_TESTS=ON \
            -DSHADERC_SKIP_EXAMPLES=ON \
            -DSHADERC_SKIP_COPYRIGHT_CHECK=ON \
            -DBUILD_SHARED_LIBS=OFF

          cmake --build build/shaderc --config $BUILD_TYPE --parallel
          cmake --install build/shaderc --config $BUILD_TYPE

      - name: Clone OpenAL-soft
        shell: bash
        run: |
          git clone \
            --branch $OPENAL_VERSION \
            --recursive \
            https://github.com/kcat/openal-soft.git

      - name: Build OpenAL-soft
        shell: bash
        run: |
          cmake -S openal-soft -B build/openal-soft \
            -G "MinGW Makefiles" \
            -DCMAKE_BUILD_TYPE=$BUILD_TYPE \
            -DCMAKE_INSTALL_PREFIX=$OPENAL_INSTALL_DIR \
            -DCMAKE_INSTALL_LIBDIR=lib \
            -DLIBTYPE=SHARED \
            -DALSOFT_UTILS=OFF \
            -DALSOFT_EXAMPLES=OFF \
            -DALSOFT_TESTS=OFF \
            -DALSOFT_INSTALL=ON

          cmake --build build/openal-soft --config $BUILD_TYPE --parallel 1
          cmake --install build/openal-soft --config $BUILD_TYPE

      - name: Clone OpenSSL
        shell: bash
        run: |
          git clone \
            --branch $OPENSSL_VERSION \
            --depth 1 \
            https://github.com/openssl/openssl.git

      - name: Build OpenSSL
        shell: bash
        run: |
          export PATH="/c/Strawberry/perl/bin:$PATH"
          perl -v | head -n 2
          which perl

          PREFIX="$(cygpath -m "$OPENSSL_INSTALL_DIR")"

          OPENSSL_ARGS=(mingw64 shared no-tests --prefix="$PREFIX" --openssldir="$PREFIX/ssl" --libdir=lib)
          if [ "$BUILD_TYPE" = "Debug" ]; then
            OPENSSL_ARGS+=(--debug)
          fi

          cd openssl
          perl Configure "${OPENSSL_ARGS[@]}"
          mingw32-make -j"$(nproc)"
          mingw32-make install_sw

      - name: Clone curl
        shell: bash
        run: |
          git clone \
            --branch $CURL_VERSION \
            --depth 1 \
            https://github.com/curl/curl.git

      - name: Build curl
        shell: bash
        run: |
          cmake -S curl -B build/curl \
            -G "MinGW Makefiles" \
            -DCMAKE_BUILD_TYPE=$BUILD_TYPE \
            -DCMAKE_INSTALL_PREFIX=$CURL_INSTALL_DIR \
            -DCMAKE_INSTALL_LIBDIR=lib \
            -DBUILD_SHARED_LIBS=ON \
            -DBUILD_STATIC_LIBS=OFF \
            -DBUILD_CURL_EXE=OFF \
            -DBUILD_TESTING=OFF \
            -DCURL_USE_LIBPSL=OFF \
            -DCURL_USE_LIBSSH2=OFF \
            -DUSE_LIBIDN2=OFF \
            -DCURL_DISABLE_LDAP=ON \
            -DCURL_BROTLI=OFF \
            -DCURL_ZSTD=OFF \
            -DCURL_USE_SCHANNEL=OFF \
            -DCURL_USE_OPENSSL=ON \
            -DOPENSSL_USE_STATIC_LIBS=OFF \
            -DOPENSSL_ROOT_DIR="$OPENSSL_INSTALL_DIR"

          cmake --build build/curl --config $BUILD_TYPE --parallel
          cmake --install build/curl --config $BUILD_TYPE

      - name: Prepare package
        shell: bash
        run: |
          package_library() {
            local name="$1"
            local install_dir="$2"
            local package_dir="package/$name"
            local build_type_lower
            local lib_dir

            build_type_lower="$(printf '%s' "$BUILD_TYPE" | tr '[:upper:]' '[:lower:]')"
            lib_dir="$package_dir/lib/$build_type_lower/$RUNNER_OS"

            mkdir -p "$package_dir/include" "$lib_dir"

            if [ -d "$install_dir/include" ]; then
              cp -r "$install_dir/include/." "$package_dir/include/"
            fi

            find "$install_dir" -type f \( \
              -name "*.lib" -o \
              -name "*.a"   -o \
              -name "*.so"  -o \
              -name "*.so.*" -o \
              -name "*.dylib" -o \
              -name "*.dll" \) \
              -exec cp -P {} "$lib_dir/" \;
          }

          package_library assimp "$ASSIMP_INSTALL_DIR"
          package_library freetype "$FREETYPE_INSTALL_DIR"
          package_library SDL3 "$SDL3_INSTALL_DIR"
          package_library shaderc "$SHADERC_INSTALL_DIR"
          package_library openal "$OPENAL_INSTALL_DIR"
          package_library curl "$CURL_INSTALL_DIR"
          package_library openssl "$OPENSSL_INSTALL_DIR"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dependencies-Windows-MinGW-${{ matrix.build_type }}
          path: package