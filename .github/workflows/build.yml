name: Build Dependencies

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
        build_type:
          - Debug
          - Release

    runs-on: ${{ matrix.os }}

    env:
      BUILD_TYPE: ${{ matrix.build_type }}
      ASSIMP_INSTALL_DIR: ${{ github.workspace }}/deps-install/assimp
      FREETYPE_INSTALL_DIR: ${{ github.workspace }}/deps-install/freetype
      SDL3_INSTALL_DIR: ${{ github.workspace }}/deps-install/SDL3
      SHADERC_INSTALL_DIR: ${{ github.workspace }}/deps-install/shaderc
      OPENAL_INSTALL_DIR: ${{ github.workspace }}/deps-install/openal

      ASSIMP_VERSION: v6.0.5
      FREETYPE_VERSION: VER-2-14-3
      SDL3_VERSION: release-3.4.8
      SHADERC_VERSION: main
      OPENAL_VERSION: 1.25.2

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt update

          sudo apt install -y \
            build-essential \
            ninja-build \
            cmake \
            pkg-config \
            libx11-dev \
            libxext-dev \
            libxtst-dev \
            libxss-dev \
            libxrandr-dev \
            libxcursor-dev \
            libxi-dev \
            libxfixes-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libasound2-dev \
            libpulse-dev \
            libgl1-mesa-dev

      - name: Setup MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Create directories
        shell: bash
        run: |
          mkdir -p build
          mkdir -p deps-install

      - name: Clone assimp
        shell: bash
        run: |
          git clone \
            --branch $ASSIMP_VERSION \
            --recursive \
            https://github.com/assimp/assimp.git

      - name: Build assimp
        shell: bash
        run: |
          cmake -S assimp -B build/assimp \
            -DCMAKE_BUILD_TYPE=$BUILD_TYPE \
            -DCMAKE_INSTALL_PREFIX=$ASSIMP_INSTALL_DIR \
            -DCMAKE_INSTALL_LIBDIR=lib \
            -DASSIMP_BUILD_TESTS=OFF \
            -DASSIMP_BUILD_ASSIMP_TOOLS=OFF \
            -DBUILD_SHARED_LIBS=ON

          cmake --build build/assimp --config $BUILD_TYPE --parallel 2
          cmake --install build/assimp --config $BUILD_TYPE

      - name: Clone freetype
        shell: bash
        run: |
          git clone \
            --branch $FREETYPE_VERSION \
            --recursive \
            https://github.com/freetype/freetype.git

      - name: Build freetype
        shell: bash
        run: |
          cmake -S freetype -B build/freetype \
            -DCMAKE_BUILD_TYPE=$BUILD_TYPE \
            -DCMAKE_INSTALL_PREFIX=$FREETYPE_INSTALL_DIR \
            -DCMAKE_INSTALL_LIBDIR=lib \
            -DBUILD_SHARED_LIBS=ON

          cmake --build build/freetype --config $BUILD_TYPE --parallel 2
          cmake --install build/freetype --config $BUILD_TYPE

      - name: Clone SDL3
        shell: bash
        run: |
          git clone \
            --branch $SDL3_VERSION \
            --recursive \
            https://github.com/libsdl-org/SDL.git SDL3

      - name: Build SDL3
        shell: bash
        run: |
          cmake -S SDL3 -B build/SDL3 \
            -DCMAKE_BUILD_TYPE=$BUILD_TYPE \
            -DCMAKE_INSTALL_PREFIX=$SDL3_INSTALL_DIR \
            -DSDL_SHARED=ON \
            -DSDL_STATIC=ON

          cmake --build build/SDL3 --config $BUILD_TYPE --parallel 2
          cmake --install build/SDL3 --config $BUILD_TYPE

      - name: Clone shaderc
        shell: bash
        run: |
          git clone \
            --branch $SHADERC_VERSION \
            https://github.com/google/shaderc.git

          python3 shaderc/utils/git-sync-deps

      - name: Build shaderc
        shell: bash
        run: |
          SHADERC_BUILD_SHARED=ON
          if [ "$RUNNER_OS" = "Windows" ]; then
            SHADERC_BUILD_SHARED=OFF
          fi

          cmake -S shaderc -B build/shaderc \
            -DCMAKE_BUILD_TYPE=$BUILD_TYPE \
            -DCMAKE_INSTALL_PREFIX=$SHADERC_INSTALL_DIR \
            -DCMAKE_INSTALL_LIBDIR=lib \
            -DSHADERC_SKIP_TESTS=ON \
            -DSHADERC_SKIP_EXAMPLES=ON \
            -DSHADERC_SKIP_COPYRIGHT_CHECK=ON \
            -DBUILD_SHARED_LIBS=$SHADERC_BUILD_SHARED \
            -DSHADERC_ENABLE_SHARED_CRT=ON \
            -DSPIRV_SKIP_TESTS=ON \
            -DSPIRV_TOOLS_INSTALL_HANDLER=OFF

          cmake --build build/shaderc --config $BUILD_TYPE --parallel 2
          cmake --install build/shaderc --config $BUILD_TYPE

      - name: Clone OpenAL-soft
        shell: bash
        run: |
          git clone \
            --branch $OPENAL_VERSION \
            --recursive \
            https://github.com/kcat/openal-soft.git

      - name: Build OpenAL-soft
        shell: bash
        run: |
          EXTRA_CXX_FLAGS=""
          if [ "$RUNNER_OS" = "macOS" ]; then
            EXTRA_CXX_FLAGS="-Wno-error=function-effects"
          fi

          cmake -S openal-soft -B build/openal-soft \
            -DCMAKE_BUILD_TYPE=$BUILD_TYPE \
            -DCMAKE_INSTALL_PREFIX=$OPENAL_INSTALL_DIR \
            -DCMAKE_INSTALL_LIBDIR=lib \
            -DCMAKE_CXX_FLAGS="$EXTRA_CXX_FLAGS" \
            -DLIBTYPE=SHARED \
            -DALSOFT_UTILS=OFF \
            -DALSOFT_EXAMPLES=OFF \
            -DALSOFT_TESTS=OFF \
            -DALSOFT_INSTALL=ON

          cmake --build build/openal-soft --config $BUILD_TYPE --parallel 2
          cmake --install build/openal-soft --config $BUILD_TYPE
      - name: Prepare package
        shell: bash
        run: |
          package_library() {
            local name="$1"
            local install_dir="$2"
            local package_dir="package/$name"
            local build_type_lower
            local lib_dir

            build_type_lower="$(printf '%s' "$BUILD_TYPE" | tr '[:upper:]' '[:lower:]')"
            lib_dir="$package_dir/lib/$build_type_lower/$RUNNER_OS"

            mkdir -p "$package_dir/include" "$lib_dir"

            if [ -d "$install_dir/include" ]; then
              cp -r "$install_dir/include/." "$package_dir/include/"
            fi

            find "$install_dir" -type f \( \
              -name "*.lib" -o \
              -name "*.a"   -o \
              -name "*.so"  -o \
              -name "*.so.*" -o \
              -name "*.dylib" -o \
              -name "*.dll" \) \
              -exec cp -P {} "$lib_dir/" \;

            if [ "$RUNNER_OS" = "Linux" ]; then
              find "$lib_dir" -type f \( \
                -name "*.a" -o \
                -name "*.so" -o \
                -name "*.so.*" \) \
                -exec strip --strip-debug {} +
            fi
          }

          package_library assimp "$ASSIMP_INSTALL_DIR"
          package_library freetype "$FREETYPE_INSTALL_DIR"
          package_library SDL3 "$SDL3_INSTALL_DIR"
          package_library shaderc "$SHADERC_INSTALL_DIR"
          package_library openal "$OPENAL_INSTALL_DIR"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dependencies-${{ runner.os }}-${{ matrix.build_type }}
          path: package